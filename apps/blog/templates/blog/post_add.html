{% extends "blog/base.html" %}

{% block page_title %}
  CryBloga | Добавить пост
{% endblock page_title %}

{% block page_content %}
  <h1>Новый пост</h1>

  <form method="POST">
    {% csrf_token %}

    <div>
      <label for="titleInput">Заголовок поста:</label>
      <input
        id="titleInput"
        name="title"
        type="text"
        placeholder="Максимальная длина 200 символов"
        required
      >
    </div>

    <div>
      <label for="textInput">Текст поста:</label>
      <textarea id="textInput" name="text" rows="3"></textarea>
    </div>

    <button type="submit">Добавить</button>
  </form>
{% endblock page_content %}
